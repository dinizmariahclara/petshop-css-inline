<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento personalizado!🐶</title>
</head>
<body style="background-color: #ecf8a9;">
    <h1 style="color: rgb(240, 57, 145)" >Monte um atendimento personalizado para seu pet🐱💕:</h1>
    <form>
        <fieldset>
            <legend>Dados pessoais:</legend>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Insira seu nome"
            required/>
            <br>
            <br>
            <label for="end">Endereço:</label>
            <input type="text" id="end" placeholder="Insira seu endereço"
            required/>
        </fieldset>

        <fieldset>
            <legend>Dados do pet:</legend>
            <label for="text">Animal:</label>
            <select id="animal">
            <option>Cachorro</option>
            <option>Gato</option>
            <option>Coelho</option>
            <option>Hamster</option>
            <option>Porquinho-da-Índia</option>
            </select>
            <br>
            <br>
            <label for="nome">Nome do pet:</label>
            <input type="text" id="nome" placeholder="Insira o nome do pet"
            required/>
            <br>
            <br>
            <legend>O animal possui alergias?</legend>
            <input type="radio" id="sim" name="tipo">
            <label for="sim">Sim</label>
            <input type="radio" id="nao" name="tipo">
            <label for="nao">Não</label>
            <br>
            <br>
            <label for="text">Se sim, especifique aqui:</label>
            <br>
            <textarea rows="6" cols= "45" id="mensagem" placeholder="Digite aqui"></textarea>
            <br>
            <br>
        </fieldset>

        <fieldset>
            <legend>Atendimento:</legend>
            <legend>Escolha um combo ou serviços separados:</legend>
            <input type="checkbox" id="banhoetosa">
            <label for="banhoetosa">Banho simples e tosa</label>
            <input type="checkbox" id="unhasedentes">
            <label for="unhasedentes">Corte de unha e limpeza dental</label>
            <input type="checkbox" id="banhoceaces">
            <label for="banhoceaces">Banho completo e acessórios</label>
            <input type="checkbox" id="eng">
            <label for="eng">Combo alimentar com ração, pacotes de sachês ou petiscos naturais</label>
            <br>
            <input type="checkbox" id="apenbanho">
            <label for="apenbanho">Apenas banho</label>
            <input type="checkbox" id="apentosa">
            <label for="apentosa">Apenas tosa</label>
            <input type="checkbox" id="limpdental">
            <label for="limpdental">Limpeza dental</label>
            <input type="checkbox" id="corteunh">
            <label for="corteunh">Corte de unha</label>
        </fieldset>

        <div style="background-color: rgb(243, 235, 156); padding: 20px; margin: 20px 0; border-left: 5px solid  #db3d99;">
            <p style="margin: 0;">Obrigada pela preferência!
            <br><br>Pagamento após o atendimento!<p>
        </div>
        <img src="cachorrinho5.jpg" style="width: 300px; border: 3px solid #db3d99; border-radius: 10px; box-shadow: 4px 4px 10px rgba(0,0,0,0.3); ">
    </form>
</body>
</html>
